<style>
  :root {

    --font: "Sora", "Helvetica Neue", Arial, sans-serif;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #19224A; --ink: #FFE98F; --soft: #FFE98FB3; --tagbg: #FFE98F26; --card: #2C1731; --chip: #FFFFFF14; --red: #FF6A55; --on-red: #19224A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--paper); }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

  header { padding: clamp(26px, 4vw, 52px) clamp(20px, 4vw, 56px) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .logo { font-size: clamp(40px, 6vw, 60px); font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
  .logo .foto { font-weight: 400; }
  .logo .o { position: relative; display: inline-block; letter-spacing: 0; }
  .logo .pupil { position: absolute; left: 50%; top: 0; width: .12em; height: .12em; border-radius: 50%; background: currentColor;
    transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px))); }
  .logo .pupil { transition: transform .12s ease-out; }
  .sub { margin-top: 10px; color: var(--soft); font-size: clamp(15px, 1.6vw, 18px); font-weight: 500; line-height: 1.3; }

  /* Tags */
  nav.filters { padding: clamp(36px, 5vw, 64px) clamp(20px, 4vw, 56px) 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tags .break { flex-basis: 100%; height: 0; }
  .tag {
    font: inherit; font-size: 16px; font-weight: 500; line-height: 1;
    color: var(--ink); background: var(--chip);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 9px 16px 10px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .tag:hover { background: var(--ink); color: var(--paper); }
  .tag[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--on-red); }
  .tag:active { transform: scale(.95); }
  .tag:disabled { opacity: .32; border-style: dashed; cursor: default; background: none; color: var(--ink); transform: none; }
  .status { margin-top: 16px; display: flex; gap: 14px; align-items: baseline; color: var(--soft); font-size: 16px; font-weight: 500; min-height: 24px; }
  #clear { font: inherit; background: none; border: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  #clear:hover { color: var(--red); }
  #clear[hidden] { display: none; }
  #order { font: inherit; background: none; border: 0; color: var(--soft); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-left: auto; }
  #order:hover { color: var(--red); }
  #want { margin-top: 14px; }
  .status { flex-wrap: wrap; }

  /* Photos */
  main {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: clamp(56px, 9vw, 130px) clamp(18px, 3vw, 44px);
    padding: clamp(20px, 3vw, 40px) clamp(20px, 4vw, 56px) clamp(60px, 9vw, 140px);
    align-items: start;
  }
  figure { grid-column: span 12; cursor: zoom-in; transition: opacity .35s ease; }
  figure[hidden] { display: none; }
  figure.fade { opacity: 0; }
  .cta { font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }
  .cta:hover { color: var(--red); }
  .shop { padding: clamp(28px, 4vw, 56px) clamp(20px, 4vw, 56px) clamp(44px, 6vw, 80px); max-width: 560px; }
  .shop h2 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
  .shop p { margin-top: 10px; color: var(--soft); font-weight: 500; line-height: 1.4; }
  .shop ul { list-style: none; margin: 20px 0 24px; display: grid; gap: 10px; }
  .shop li { display: flex; justify-content: space-between; gap: 20px; border: 2px solid var(--ink); border-radius: 999px; padding: 12px 20px; font-weight: 500; }
  .shop li b { font-weight: 600; }
  figcaption { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--soft); font-variant-numeric: tabular-nums; }
  figure img { display: block; width: 100%; height: auto; border-radius: 3px; background: #00000010; }
  figure.size-m, figure.size-s { grid-column: span 6; }
  figure.land { grid-column: span 12; }

  @media (min-width: 760px) {
    figure.size-l { grid-column: span 6; }
    figure.size-m { grid-column: span 4; }
    figure.size-s { grid-column: span 3; }
    figure.land   { grid-column: span 8; }
    figure.off-1 { margin-top: clamp(32px, 7vw, 110px); }
    figure.off-2 { margin-top: clamp(14px, 2.6vw, 40px); }
  }

  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
    padding: 0 clamp(20px, 4vw, 56px) calc(clamp(28px, 4vw, 48px) + 64px);
    color: var(--soft); font-size: 16px; font-weight: 500;
  }
  footer a { color: inherit; text-underline-offset: 3px; }
  footer a:hover { color: var(--red); }

  /* Bouton rond pour remonter aux tags */
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6;
    font: inherit; font-size: 16px; font-weight: 600;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 999px;
    padding: 12px 18px; cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity .2s, transform .2s;
  }
  .fab.on { opacity: 1; pointer-events: auto; transform: none; }

  /* Visionneuse */
  dialog { border: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: var(--paper); }
  .viewer { position: relative; height: 100%; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 64px 16px 8px; touch-action: pan-y; }
  .stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 3px; }
  .info { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 6px 16px 4px; }
  .vnum { font-size: 14px; font-weight: 500; color: var(--soft); }
  .vtags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip button { flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 3px; overflow: hidden; cursor: pointer; opacity: .5; background: none; outline-offset: 2px; transition: opacity .15s; }
  .strip button:hover { opacity: .85; }
  .strip button[aria-current="true"] { opacity: 1; outline: 2px solid var(--ink); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nav-btn { font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); background: var(--chip); border: 2px solid var(--ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .nav-btn:hover { background: var(--ink); color: var(--paper); }
  .close { position: absolute; top: 14px; right: 14px; z-index: 2; }
  .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
  .prev { left: 10px; }
  .next { right: 10px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    figure, .tag, .fab, .logo .pupil { transition: none; }

  /* Tags plus petits, sans contour */
  .tag { font-size: 14px; padding: 7px 13px 8px; border: 0; background: var(--tagbg); }
  .tag:hover { background: var(--ink); color: var(--paper); }
  .tag[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
  .tag:disabled { opacity: .35; background: var(--tagbg); }
  .vtags .tag { font-size: 14px; padding: 6px 12px 7px; }
  .shop li { border: 0; background: var(--tagbg); }

  /* Bascule vrac / mosaïque */
  #view { font: inherit; background: none; border: 0; color: var(--soft); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-left: auto; }
  #view:hover { color: var(--red); }
  #order { margin-left: 0; }
  main.mosaic { grid-template-columns: repeat(3, 1fr); gap: 3px; padding-top: 24px; }
  main.mosaic figure { grid-column: auto !important; margin-top: 0 !important; align-self: stretch !important; }
  main.mosaic figure img { aspect-ratio: 1 / 1; object-fit: cover; border-radius: 0; }
  main.mosaic figcaption { display: none; }
  @media (min-width: 760px) { main.mosaic { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { main.mosaic { grid-template-columns: repeat(5, 1fr); } }
</style>
</head>

<!--
  AJOUTER UNE PHOTO, en 3 étapes :
  1. Dépose le fichier dans le dossier images/ (par exemple images/phare.jpg).
  2. Copie un bloc <figure> ci-dessous et colle-le juste avant la balise de fin de main.
  3. Change src, alt et data-tags (mer, marseille, gens, nature, détails, mimines, séparés par des virgules).
  Le numéro, la légende et la taille sont ajoutés tout seuls. Pour fixer toi-même un numéro, ajoute data-num="52".
  Exemple minimal :
  <figure data-tags="mer,gens"><img src="images/phare.jpg" alt="Un phare au coucher du soleil" loading="lazy"></figure>

  AJOUTER UN TAG : ajoute un bouton dans la liste des tags en haut (copie-en un), avec le même nom
  dans data-tag, puis utilise ce nom dans le data-tags des photos concernées.
  Les tags se cumulent : une photo doit avoir TOUS les tags choisis pour s'afficher.
-->

<section class="shop" id="tirages">
  <h2>J'en veux une</h2>
  <p>Une photo te plaît ? Écris-moi avec son numéro.</p>
  <ul>
    <li><span>40 × 30 cm</span><b>49 €</b></li>
    <li><span>21 × 30 cm</span><b>35 €</b></li>
  </ul>
  <a class="cta" data-contact data-prefix="Écrire à "></a>
</section>

<footer>
  <span>© <span id="year"></span> oyo foto</span>
  <a data-contact></a>
</footer>

<button type="button" class="fab" id="fab" aria-label="Revenir aux tags">Tags</button>

<dialog id="viewer" aria-label="Photo en grand">
  <div class="viewer">
    <button class="nav-btn close" type="button" aria-label="Fermer">Fermer</button>
    <div class="stage">
      <button class="nav-btn prev" type="button" aria-label="Photo précédente">Préc.</button>
      <img id="viewer-img" alt="">
      <button class="nav-btn next" type="button" aria-label="Photo suivante">Suiv.</button>
    </div>
    <div class="info">
      <span class="vnum" id="vnum"></span>
      <div class="vtags" id="vtags"></div>
      <a class="cta" id="vwant">J'en veux une</a>
    </div>
    <div class="strip" id="strip" aria-label="Autres photos"></div>
  </div>
</dialog>

<script>
  // Ton contact : à changer ici, une seule fois (il s'affiche partout dans la page)
  const CONTACT = 'juliette.poyet.revol@gmail.com';
  document.querySelectorAll('[data-contact]').forEach(a => {
    a.href = 'mailto:' + CONTACT;
    a.textContent = (a.dataset.prefix || '') + CONTACT;
  });

  // Photos ajoutées à la main : numéro, légende et taille sont ajoutés automatiquement s'ils manquent
  (function prepare() {
    const figs = [...document.querySelectorAll('#grid figure')];
    const used = new Set(figs.map(f => +f.dataset.num).filter(Boolean));
    figs.forEach(f => {
      if (!f.dataset.num) {
        let n, tries = 0;
        do { n = 1 + Math.floor(Math.random() * 99); tries++; } while (used.has(n) && tries < 500);
        used.add(n); f.dataset.num = n;
      }
      if (!f.querySelector('figcaption')) {
        const c = document.createElement('figcaption'); c.textContent = f.dataset.num; f.appendChild(c);
      }
      if (!f.dataset.tags) f.dataset.tags = '';
      if (!/\b(size-[sml]|land)\b/.test(f.className)) {
        const img = f.querySelector('img');
        const apply = () => {
          f.classList.add(img.naturalWidth > img.naturalHeight ? 'land' : ['size-s', 'size-m', 'size-m', 'size-l'][Math.floor(Math.random() * 4)]);
          setTimeout(() => layout(), 0);
        };
        if (img.complete && img.naturalWidth) apply(); else img.addEventListener('load', apply, { once: true });
      }
    });
  })();

  const figures = [...document.querySelectorAll('#grid figure')];
  const tagButtons = [...document.querySelectorAll('#filters .tag')];
  const labels = Object.fromEntries(tagButtons.map(b => [b.dataset.tag, b.textContent]));
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear');
  const fab = document.getElementById('fab');
  const selected = new Set();
  document.getElementById('year').textContent = new Date().getFullYear();

  const tagsOf = f => f.dataset.tags.split(',').map(t => t.trim());

  // « oyo » : de petites pupilles dans les deux « o », qui suivent le doigt ou la souris
  const logo = document.getElementById('logo');
  const pupils = [...logo.querySelectorAll('.pupil')];
  const cvs = document.createElement('canvas').getContext('2d');
  let eyeH = 20;
  function placePupils() {
    const cs = getComputedStyle(logo);
    cvs.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const fs = parseFloat(cs.fontSize);
    const m = cvs.measureText('o');
    const A = m.fontBoundingBoxAscent ?? fs * .8, D = m.fontBoundingBoxDescent ?? fs * .2;
    const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
    const baseline = (fs - (A + D)) / 2 + A;   // du haut de la ligne à la ligne de base
    eyeH = asc + desc;
    pupils.forEach(p => {
      p.style.top = (baseline - (asc - desc) / 2) + 'px';
      p.style.width = p.style.height = (eyeH * .16) + 'px';
    });
  }
  window.placePupils = placePupils;
  placePupils();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placePupils);
  addEventListener('resize', placePupils);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    addEventListener('pointermove', ev => {
      pupils.forEach(p => {
        const r = p.parentElement.getBoundingClientRect();
        const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
        const k = Math.min(1, Math.hypot(dx, dy) / 200), a = Math.atan2(dy, dx);
        p.style.setProperty('--px', (Math.cos(a) * eyeH * .12 * k) + 'px');
        p.style.setProperty('--py', (Math.sin(a) * eyeH * .12 * k) + 'px');
      });
    }, { passive: true });
  }

  const grid = document.getElementById('grid');
  const ordered = () => [...grid.querySelectorAll('figure')];

  // Mise en page « magazine » : chaque photo prend une largeur et une position au hasard sur 12 colonnes
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function spanFor(f, wide) {
    if (f.classList.contains('land')) return wide ? pick([6, 7, 8, 9]) : pick([10, 12]);
    if (f.classList.contains('size-l')) return wide ? pick([5, 6]) : pick([8, 9]);
    if (f.classList.contains('size-m')) return wide ? pick([4, 5]) : pick([7, 8]);
    return wide ? pick([3, 4]) : pick([5, 6]);
  }
  function layout() {
    const wide = matchMedia('(min-width: 760px)').matches;
    const vis = ordered().filter(f => !f.hidden);
    let i = 0;
    while (i < vis.length) {
      const row = []; let sum = 0;
      while (i < vis.length && row.length < (wide ? 3 : 2)) {
        const sp = spanFor(vis[i], wide);
        if (row.length && sum + sp > 12) break;
        row.push([vis[i], sp]); sum += sp; i++;
        if (Math.random() < 0.3) break;
      }
      const gaps = new Array(row.length + 1).fill(0);
      for (let free = 12 - sum; free > 0; free--) gaps[Math.floor(Math.random() * gaps.length)]++;
      let col = 1;
      row.forEach(([f, sp], k) => {
        col += gaps[k];
        f.style.gridColumn = col + ' / span ' + sp;
        col += sp;
        f.style.alignSelf = pick(['start', 'center', 'end']);
        f.style.marginTop = Math.round(Math.random() * (wide ? 90 : 30)) + 'px';
      });
    }
  }
  matchMedia('(min-width: 760px)').addEventListener('change', () => layout());

  function updateUI() {
    const visible = figures.filter(f => !f.hidden);
    tagButtons.forEach(b => {
      const t = b.dataset.tag, on = selected.has(t);
      b.setAttribute('aria-pressed', String(on));
      // grise les tags qui ne donneraient aucune photo en plus de la sélection actuelle
      b.disabled = !on && !visible.some(f => tagsOf(f).includes(t));
    });
    countEl.textContent = visible.length + (visible.length > 1 ? ' photos' : ' photo');
    clearBtn.hidden = selected.size === 0;
    fab.textContent = selected.size ? 'Tags (' + selected.size + ')' : 'Tags';
  }

  function applyFilters() {
    figures.forEach(f => f.classList.add('fade'));
    setTimeout(() => {
      figures.forEach(f => {
        const tags = tagsOf(f);
        f.hidden = ![...selected].every(t => tags.includes(t));
      });
      layout();
      updateUI();
      requestAnimationFrame(() => figures.forEach(f => f.classList.remove('fade')));
    }, 180);
  }

  function toggle(tag) {
    selected.has(tag) ? selected.delete(tag) : selected.add(tag);
    applyFilters();
  }
  tagButtons.forEach(b => b.addEventListener('click', () => toggle(b.dataset.tag)));
  clearBtn.addEventListener('click', () => { selected.clear(); applyFilters(); });
  layout(); updateUI();

  // Ordre : aléatoire (différent à chaque visite) ou croissant par numéro, au choix
  const orderBtn = document.getElementById('order');
  let ascending = false;
  function reorder() {
    const list = ordered();
    if (ascending) list.sort((a, b) => a.dataset.num - b.dataset.num);
    else for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    list.forEach(f => grid.appendChild(f));
    orderBtn.textContent = ascending ? 'Ordre : croissant' : 'Ordre : aléatoire';
    layout();
  }
  orderBtn.addEventListener('click', () => { ascending = !ascending; reorder(); });
  reorder();

  // Vue : « vrac » (mise en page libre) ou « mosaïque » serrée, façon Instagram
  const viewBtn = document.getElementById('view');
  let mosaic = false;
  viewBtn.addEventListener('click', () => {
    mosaic = !mosaic;
    grid.classList.toggle('mosaic', mosaic);
    viewBtn.textContent = mosaic ? 'Vue : mosaïque' : 'Vue : vrac';
  });

  // Bouton « Tags » : visible quand la liste des tags n'est plus à l'écran
  const filtersEl = document.getElementById('filters');
  new IntersectionObserver(([e]) => fab.classList.toggle('on', !e.isIntersecting)).observe(filtersEl);
  fab.addEventListener('click', () => filtersEl.scrollIntoView({ behavior: 'smooth', block: 'start' }));

  // Visionneuse : grande photo, tags cliquables, petit carrousel en bas, glisser du doigt
  const dlg = document.getElementById('viewer');
  const big = document.getElementById('viewer-img');
  const vtags = document.getElementById('vtags');
  const strip = document.getElementById('strip');
  let current = 0, shown = [];
  const visibleFigs = () => ordered().filter(f => !f.hidden);

  function buildStrip() {
    strip.replaceChildren(...shown.map((f, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-label', 'Photo n° ' + f.dataset.num);
      const im = document.createElement('img');
      im.src = f.querySelector('img').src; im.alt = ''; im.loading = 'lazy';
      b.appendChild(im);
      b.addEventListener('click', () => show(i));
      return b;
    }));
  }

  function show(i) {
    current = (i + shown.length) % shown.length;
    const fig = shown[current], img = fig.querySelector('img'), n = fig.dataset.num;
    big.src = img.src; big.alt = img.alt;
    document.getElementById('vnum').textContent = 'n° ' + n;
    document.getElementById('vwant').href = 'mailto:' + CONTACT
      + '?subject=' + encodeURIComponent('oyo foto – photo n° ' + n)
      + '&body=' + encodeURIComponent('Bonjour, je voudrais un tirage de la photo n° ' + n + '.\nFormat : ');
    vtags.replaceChildren(...tagsOf(fig).map(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tag';
      b.textContent = labels[t] || t;
      b.setAttribute('aria-pressed', String(selected.has(t)));
      b.addEventListener('click', () => {
        dlg.close();
        if (!selected.has(t)) selected.add(t);
        applyFilters();
      });
      return b;
    }));
    [...strip.children].forEach((b, k) => b.setAttribute('aria-current', String(k === current)));
    const cur = strip.children[current];
    if (cur) strip.scrollTo({ left: cur.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2, behavior: 'smooth' });
  }
  figures.forEach(f => f.addEventListener('click', () => {
    shown = visibleFigs();
    buildStrip();
    show(shown.indexOf(f));
    dlg.showModal();
  }));
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.querySelector('.prev').addEventListener('click', () => show(current - 1));
  dlg.querySelector('.next').addEventListener('click', () => show(current + 1));
  dlg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.classList.contains('viewer') || e.target.classList.contains('stage')) dlg.close();
  });
  let sx = null;
  const stage = dlg.querySelector('.stage');
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
  });
</script>
